# Configuração de acesso ao banco de dados (lida por ConnectionFactory).
# Qualquer chave ausente usa o valor padrão definido em ConnectionFactory.
# Também é possível sobrescrever via System Property, ex.: -Ddb.password=segredo
# Nota: No MariaDB local sem senha de root configurada, o acesso sem sudo utiliza o
# usuário anônimo ('') com permissão sobre bancos prefixados por 'test_'.
# Caso configure o usuário root para acesso via TCP (ver instruções no README/SQL),
# altere para gestao_saude_db e db.user=root.
db.url=jdbc:mysql://localhost:3306/test_gestao_saude_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.user=
db.password=
